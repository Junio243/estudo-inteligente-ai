name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # sem cache: repo não tem package-lock.json committed
      - run: npm install --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
